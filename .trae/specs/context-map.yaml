# Navigation aid for agents. This file is not a source of truth for behavior.
# It maps common code paths and change types to the minimum spec documents that
# should be read before implementation.

root:
  product_source_of_truth: .trae/specs/spec.md
  checklist: .trae/specs/CONTRACT_CHECKLIST.md

modules:
  novel-continuation-mvp:
    context: .trae/specs/novel-continuation-mvp/AGENT_CONTEXT.md
    docs:
      spec: .trae/specs/novel-continuation-mvp/spec.md
      design: .trae/specs/novel-continuation-mvp/design.md
      contracts: .trae/specs/novel-continuation-mvp/contracts.md
      tasks: .trae/specs/novel-continuation-mvp/tasks.md
    code_paths:
      - novel_agent/app/orchestrators/main_layer_orchestrator.py
      - novel_agent/app/run_mvp.py
      - novel_agent/app/run_interactive.py
      - novel_agent/app/run_continue_scene.py
      - novel_agent/app/schemas/orchestration_schema.py
    read_when:
      - main orchestration
      - document baseline
      - shared cross-layer contract
      - local run foundation

  narrative-memory-context:
    context: .trae/specs/narrative-memory-context/AGENT_CONTEXT.md
    docs:
